name: Pages Preview

on:
  push:

# TODO(Rückfrage): Der offizielle GitHub-Pages-Deploy kennt nur EINE Live-Seite.
# Ein Push auf irgendeinen Branch überschreibt daher den aktuellen Preview.
# Für echte Previews pro Branch bräuchte es einen anderen Ansatz (z. B. Deploy
# in Unterordner via peaceiris/actions-gh-pages). Vorerst: letzter Push gewinnt.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build with Pages base path
        run: npm run build
        env:
          VITE_BASE: /halt-die-linie/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
